  var KEY_STORAGE = "enc_key_n3-kanji-flashcard";
  var form = document.getElementById("gate");
  var input = document.getElementById("gate-input");
  var button = document.getElementById("gate-button");
  var error = document.getElementById("gate-error");

  function fromBase64(text) {
    var binary = atob(text);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function toBase64(bytes) {
    var binary = "";
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function load() { try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; } }
  function save(raw) { try { localStorage.setItem(KEY_STORAGE, toBase64(raw)); } catch (e) {} }
  function forget() { try { localStorage.removeItem(KEY_STORAGE); } catch (e) {} }

  function keyFromPassword(password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]).then(function (material) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(ENC.salt), iterations: ENC.iterations }, material, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  // 鍵が違えば AES-GCM の検証で失敗する
  function decrypt(raw) {
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(ENC.iv) }, key, fromBase64(ENC.data));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  // 読み込みの途中で document.write すると、入れ替わらずに後ろへ足されてしまうので、読み込みが終わってから入れ替える
  function open(html) {
    function replace() {
      document.open();
      document.write(html);
      document.close();
    }
    if (document.readyState === "complete") {
      replace();
    } else {
      window.addEventListener("load", function () { setTimeout(replace, 0); }, { once: true });
    }
  }
  function ask(message) {
    form.classList.add("show");
    error.textContent = message || "";
    button.disabled = false;
    button.textContent = "開く / Buka";
    input.value = "";
    input.focus();
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    button.disabled = true;
    button.textContent = "確認中… / Memeriksa…";
    var raw;
    keyFromPassword(input.value.trim()).then(function (bits) {
      raw = bits;
      return decrypt(raw);
    }).then(function (html) {
      save(raw);
      open(html);
    }, function () {
      ask("パスワードが違います / Kata sandi salah");
    });
  });

  if (!window.crypto || !crypto.subtle) {
    form.classList.add("show");
    form.innerHTML = "<p>このブラウザでは開けません。新しいブラウザで開いてください。<br>Browser ini tidak didukung.</p>";
    return;
  }
  var saved = load();
  if (saved) {
    decrypt(fromBase64(saved)).then(open, function () {
      // パスワードを変えた時など。もう一度聞く
      forget();
      ask("");
    });
  } else {
    ask("");
  }
})();
